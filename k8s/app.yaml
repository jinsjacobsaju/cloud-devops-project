apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-devops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-devops-demo
  template:
    metadata:
      labels:
        app: cloud-devops-demo
    spec:
      containers:
        - name: website
          image: cloud-devops-demo:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-devops-demo
spec:
  type: NodePort
  selector:
    app: cloud-devops-demo
  ports:
    - port: 80
      targetPort: 80
